<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartRoute Kerala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ee;--panel:#fff;--ink:#14281f;--mute:#566a5e;--line:#cdd9d0;--teal:#0f766e;--red:#b5472b;--blue:#2b5c8a;--gold:#a67608;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a15;--panel:#16251e;--ink:#e6efe9;--mute:#9db1a5;--line:#2b4137;--teal:#2dd4bf;--red:#f08a6a;--blue:#7fb2e5;--gold:#e3b341;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a15;--panel:#16251e;--ink:#e6efe9;--mute:#9db1a5;--line:#2b4137;--teal:#2dd4bf;--red:#f08a6a;--blue:#7fb2e5;--gold:#e3b341;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif}
header{padding:18px 20px 6px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--mute)}
.tabs{display:flex;gap:6px;padding:10px 20px;overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:20px;font:600 14px Manrope,system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:16px;padding:6px 20px 28px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.box+.box{margin-top:12px}
label{display:block;font-weight:600;font-size:13px;color:var(--mute);margin:8px 0 3px}
input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.hint{color:var(--red);font-size:13px;margin:6px 0 0}
.card{border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.card.on{border-color:var(--c)}
.card h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.card .st{color:var(--mute);font-size:13px;margin-top:2px}
.i{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--blue);background:none;color:var(--blue);font:700 14px Manrope,sans-serif;cursor:pointer}
.why{margin-top:8px;padding:10px;background:var(--bg);border-radius:8px;font-size:13px}
.why b{display:block}.why p{margin:3px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600}
h2{font-size:15px;margin:0 0 6px}
svg{width:100%;height:auto;max-height:82vh;display:block}
.legend{font-size:12px;color:var(--mute);margin-top:6px}
ol{margin:4px 0;padding-left:20px}
</style></head>
<body>
<header><h1>SmartRoute Kerala</h1><p>Choose what you need, compare every route, and tap ⓘ to learn which algorithm picked it.</p></header>
<div class="tabs" id="tabs"></div>
<main>
<section><div class="box" id="form"></div><div id="res"></div></section>
<section class="box"><svg id="map" viewBox="0 0 400 610" role="img" aria-label="Route map"></svg>
<div class="legend">Schematic map with sample data. Distances, flood levels, beds and camp capacity are approximate demo values.</div></section>
</main>
<script>
const KM=1,MN=2,$=s=>document.querySelector(s);
const P={"Thiruvananthapuram":[175,565],"Kollam":[160,495],"Pathanamthitta":[225,465],"Alappuzha":[125,395],"Kottayam":[190,410],"Idukki":[245,355],"Kochi":[150,335],"Thrissur":[190,285],"Palakkad":[270,255],"Kozhikode":[230,165],"Kannur":[270,90],"Kasaragod":[300,30],"Wayanad":[330,150]};
const CP={"Main Gate":[60,540],"Parking":[60,430],"Admin Block":[170,500],"Library":[180,390],"Class Block A":[280,440],"Computer Lab":[280,330],"Canteen":[130,280]};
const mk=(n,E)=>{const g={};Object.keys(n).forEach(c=>g[c]=[]);E.forEach(([a,b,k,m])=>{g[a].push([b,k,m??k]);g[b].push([a,k,m??k])});return g};
let RD=[],CD=[],FL={},CAMP={},HOS={},CH=new Set(),KG={},CG={},QUEUE=[];
const COL=["var(--teal)","var(--red)","var(--blue)","var(--gold)"];

/* ---------- learn panel text ---------- */
const A={
dijkstra:["Dijkstra’s algorithm","A min-heap always returns the unvisited place with the lowest total cost so far. Each road then lowers its neighbour’s cost if it finds a cheaper way. When the destination is popped, its cost is the minimum."],
bfs:["Breadth-First Search","A queue explores places level by level: all places 1 road away, then 2 roads away, and so on. The first time it reaches the destination, no route with fewer roads exists."],
dfs:["Depth-First Search + sorting","Recursion goes as deep as possible along each road, then backtracks, collecting every simple route. The routes are then sorted by distance to rank the alternatives."],
heap:["Priority queue (min-heap)","Items leave in order of priority, not arrival. Emergency requests use urgency as the priority, so the most urgent is always served first in O(log n) time."],
hash:["Hash map","Camp capacities, hospital beds and flood levels are stored as key → value pairs, so any place can be looked up in about O(1) time."],
ev:["Dijkstra on battery states","Each state is (city, battery left). Driving lowers the battery and costs travel time. Charging at a station resets the battery and costs 40 minutes. Dijkstra finds the cheapest total time."],
block:["Graph with blocked nodes","Flooded places are removed from the graph before Dijkstra runs, so the search can never route through them."]};

/* ---------- state ---------- */
const MODES={nav:"Navigate",flood:"Flood evacuation",ev:"EV planner",amb:"Ambulance",campus:"Campus"};
const S={mode:"nav",a:"Thiruvananthapuram",b:"Kozhikode",range:150,sel:0,open:-1,msg:""};
const defs={nav:["Thiruvananthapuram","Kozhikode"],flood:["Alappuzha",""],ev:["Thiruvananthapuram","Kannur"],amb:["Thiruvananthapuram",""],campus:["Main Gate","Computer Lab"]};
const cityNames=Object.keys(P),campNames=Object.keys(CP);
const G=()=>S.mode==="campus"?CG:KG,PT=()=>S.mode==="campus"?CP:P;
const fmt=m=>S.mode==="campus"?Math.round(m/80)+" min walk":Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";
const unit=()=>S.mode==="campus"?"m":"km";
const find=(list,v)=>{v=v.trim().toLowerCase();if(!v)return null;return list.find(x=>x.toLowerCase()===v)||list.find(x=>x.toLowerCase().includes(v))||null};

/* ---------- ask the Python server for the routes ---------- */
async function compute(){const q=new URLSearchParams({mode:S.mode,a:S.a,b:S.b,range:S.range});
try{const r=await(await fetch("/api/routes?"+q)).json();QUEUE=r.queue||[];r.R.forEach(x=>x.color=COL[x.color]);return{R:r.R,err:r.err,bl:r.bl?new Set(r.bl):undefined}}
catch(e){return{R:[],err:"Cannot reach the Python server. Run app.py first."}}}

/* ---------- drawing ---------- */
function suffix(c){if(S.mode==="flood"){let t="";if(FL[c]!==undefined&&FL[c]>0)t+=" 🌊"+FL[c];if(CAMP[c])t+=" ⛺"+(CAMP[c][0]-CAMP[c][1]);return t}
if(S.mode==="amb"&&HOS[c])return" ✚"+HOS[c][1];if(S.mode==="ev"&&CH.has(c))return" ⚡";return""}
function draw(R,x){const g=G(),pt=PT(),sel=R[S.sel];let h="";
for(const u in g)for(const e of g[u])if(u<e[0])h+=`<line x1="${pt[u][0]}" y1="${pt[u][1]}" x2="${pt[e[0]][0]}" y2="${pt[e[0]][1]}" stroke="var(--line)" stroke-width="2"/>`;
R.forEach((r,i)=>{if(i===S.sel)return;h+=poly(r,pt,3,.55)});if(sel)h+=poly(sel,pt,6,1);
for(const c in pt){const[px,py]=pt[c],bl=x.bl&&x.bl.has(c),onP=sel&&sel.path.includes(c),end=c===S.a||c===S.b&&S.mode!=="flood"&&S.mode!=="amb";
h+=`<circle cx="${px}" cy="${py}" r="${end?8:5}" fill="${bl?"var(--red)":onP?"var(--ink)":"var(--panel)"}" stroke="${bl?"var(--red)":"var(--ink)"}" stroke-width="2"/>`;
const right=px<250;h+=`<text x="${px+(right?12:-12)}" y="${py+4}" font-size="11" font-weight="${end?800:600}" text-anchor="${right?"start":"end"}" fill="var(--ink)">${c}${suffix(c)}</text>`}
$("#map").innerHTML=h}
function poly(r,pt,w,o){const pts=r.path.map(c=>pt[c].join(",")).join(" ");let s=`<polyline points="${pts}" fill="none" stroke="${r.color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${o}"${r.dash?' stroke-dasharray="8 6"':""}/>`;
r.charges.forEach(c=>{s+=`<text x="${pt[c][0]-6}" y="${pt[c][1]-10}" font-size="14">⚡</text>`});return s}

/* ---------- UI ---------- */
function form(){const m=S.mode,camp=m==="campus",names=camp?campNames:cityNames;let h=`<datalist id="dl">${names.map(n=>`<option value="${n}">`).join("")}</datalist>`;
const one=m==="flood"||m==="amb";
h+=`<label for="a">${one?(m==="amb"?"Accident location":"Your location"):"From"}</label><input id="a" list="dl" value="${S.a}" placeholder="Search a place" autocomplete="off">`;
if(!one)h+=`<label for="b">To</label><input id="b" list="dl" value="${S.b}" placeholder="Search a place" autocomplete="off">`;
if(m==="ev")h+=`<label for="r">Battery range: <span id="rv">${S.range}</span> km</label><input id="r" type="range" min="60" max="400" step="10" value="${S.range}">`;
h+=`<div class="hint" id="hint">${S.msg}</div>`;$("#form").innerHTML=h;
const bind=(id,k)=>{const el=$("#"+id);if(!el)return;el.onchange=()=>{const v=find(names,el.value);if(v){S[k]=v;S.msg="";S.sel=0;S.open=-1}else S.msg="No place named “"+el.value+"”. Pick one from the list.";render(1)}};bind("a","a");bind("b","b");
if($("#r"))$("#r").oninput=e=>{S.range=+e.target.value;$("#rv").textContent=S.range;S.sel=0;S.open=-1;render(1)}}
async function render(keep){if(!keep)form();const{R,err,bl}=await compute();draw(R,{bl});let h="";
if(err)h=`<div class="box"><div class="hint">${err}</div></div>`;
else{h=`<div class="box"><h2>Routes found</h2>`+R.map((r,i)=>`<div class="card ${i===S.sel?"on":""}" style="--c:${r.color}" data-i="${i}"><h3><span class="dot"></span>${r.label}<button class="i" data-w="${i}" aria-label="Why this route was chosen" aria-expanded="${S.open===i}">i</button></h3><div class="st">${r.k} ${unit()} · ${fmt(r.m)} · ${Math.max(r.path.length-2,0)} stop(s)${r.note?" · "+r.note:""}</div>${S.open===i?`<div class="why"><p>${r.why}</p>${r.algos.map(k=>`<b>${A[k][0]}</b><p>${A[k][1]}</p>`).join("")}</div>`:""}</div>`).join("")+`</div>`;
h+=`<div class="box"><h2>Comparison</h2><table><tr><th>Route</th><th>${unit()}</th><th>Time</th><th>Stops</th></tr>${R.map((r,i)=>`<tr${i===S.sel?' style="font-weight:800"':""}><td>${r.label}</td><td>${r.k}</td><td>${fmt(r.m)}</td><td>${Math.max(r.path.length-2,0)}</td></tr>`).join("")}</table></div>`;
if(S.mode==="flood")h+=emergency()}
$("#res").innerHTML=h}
function emergency(){const out=QUEUE.map(x=>`<li>[urgency ${x[0]}] ${x[1]}</li>`);
return`<div class="box"><h2>Emergency queue <button class="i" data-w="q" aria-label="About the priority queue">i</button></h2><ol>${out.join("")}</ol>${S.open==="q"?`<div class="why"><b>${A.heap[0]}</b><p>${A.heap[1]}</p></div>`:""}</div>`}
document.addEventListener("click",e=>{const w=e.target.closest("[data-w]");if(w){const v=w.dataset.w==="q"?"q":+w.dataset.w;S.open=S.open===v?-1:v;if(v!=="q")S.sel=v;render(1);return}
const c=e.target.closest(".card");if(c){S.sel=+c.dataset.i;render(1)}});
$("#tabs").innerHTML=Object.entries(MODES).map(([k,v])=>`<button data-m="${k}">${v}</button>`).join("");
$("#tabs").onclick=e=>{const k=e.target.dataset.m;if(!k)return;S.mode=k;[S.a,S.b]=defs[k];S.sel=0;S.open=-1;S.msg="";
document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===k));render()};
document.querySelector('#tabs button[data-m="nav"]').classList.add("on");
fetch("/api/meta").then(r=>r.json()).then(m=>{RD=m.roads;CD=m.campus;FL=m.flood;CAMP=m.camps;HOS=m.hospitals;CH=new Set(m.chargers);KG=mk(P,RD);CG=mk(CP,CD);render()}).catch(()=>{$("#res").innerHTML='<div class="box"><div class="hint">Cannot reach the Python server. Run app.py first.</div></div>'});
</script>
</body></html>
